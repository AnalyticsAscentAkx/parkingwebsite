[project]
name = "evlayer"
version = "0.1.0"
description = "EV charger reliability + charge-and-park cost layer for parkingnetherlands.com"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
export = ["pyarrow>=17.0"]

[project.scripts]
ev = "evlayer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evlayer*"]
